{% extends "base.html" %}

{% block title %}Workspace Chat{% endblock %}

{% block head %}
<style>
    .workspace-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar Styling */
    .sidebar {
        width: 260px;
        background: var(--bg-surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
    }

    .btn-new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        width: calc(100% - 2rem);
        margin: 0.75rem 1rem;
        padding: 0.55rem;
        background: var(--bg-element);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .btn-new-chat:hover {
        background: var(--bg-hover);
    }

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .chat-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.55rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
        position: relative;
        group: relative;
    }

    .chat-item:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
    }

    .chat-item.active {
        background: var(--bg-element);
        color: var(--text-primary);
        font-weight: 500;
    }

    .chat-title-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        margin-right: 0.5rem;
    }

    .btn-delete-chat {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        opacity: 0;
        padding: 2px 4px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.15s ease, color 0.15s ease;
    }

    .chat-item:hover .btn-delete-chat {
        opacity: 1;
    }

    .btn-delete-chat:hover {
        color: var(--danger);
        background: var(--danger-bg);
    }

    .sidebar-footer {
        padding: 0.85rem 1rem;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        color: var(--text-secondary);
    }

    .user-name {
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
    }

    /* Main Chat Content */
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg-base);
        height: 100vh;
    }

    .chat-topbar {
        padding: 0.85rem 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-surface);
    }

    .active-chat-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
    }

    .msg-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        max-width: 85%;
    }

    .msg-group.user {
        align-self: flex-end;
        align-items: flex-end;
    }

    .msg-group.assistant {
        align-self: flex-start;
        align-items: flex-start;
    }

    .msg-sender {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        padding: 0 0.25rem;
    }

    .msg-bubble {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .msg-group.user .msg-bubble {
        background: var(--bg-element);
        color: var(--text-primary);
        border: 1px solid var(--border);
    }

    .msg-group.assistant .msg-bubble {
        background: transparent;
        color: var(--text-primary);
        padding: 0.5rem 0;
    }

    /* Input Footer */
    .input-container {
        padding: 1rem 1.5rem 1.5rem;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
    }

    .prompt-form {
        display: flex;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.4rem 0.5rem;
        transition: border-color 0.15s ease;
    }

    .prompt-form:focus-within {
        border-color: var(--text-muted);
    }

    .prompt-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        padding: 0.5rem 0.75rem;
        color: var(--text-primary);
        font-size: 0.9rem;
    }

    .btn-send {
        background: var(--text-primary);
        color: var(--bg-base);
        border: none;
        border-radius: 6px;
        padding: 0.45rem 0.85rem;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }

    .btn-send:hover {
        opacity: 0.9;
    }

    .btn-send:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
</style>
{% endblock %}

{% block content %}
<div class="workspace-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="brand-icon">W</span> Workspace
            </div>
        </div>

        <button class="btn-new-chat" id="btnNewChat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Chat
        </button>

        <div class="sidebar-nav" id="conversationsList">
            <!-- Dynamically populated conversations -->
        </div>

        <div class="sidebar-footer">
            {% if g.user %}
                <span class="user-name">{{ g.user['username'] }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn-sm btn-outline">Log out</a>
            {% else %}
                <span class="user-name">Guest User</span>
                <a href="{{ url_for('auth.login') }}" class="btn-sm btn-outline">Log in</a>
            {% endif %}
        </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-main">
        <div class="chat-topbar">
            <div class="active-chat-title" id="activeChatTitle">New Chat</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages rendered dynamically -->
        </div>

        <div class="input-container">
            <form class="prompt-form" id="promptForm">
                <input type="text" id="promptInput" class="prompt-input" placeholder="Message assistant..." autocomplete="off" required />
                <button type="submit" id="btnSubmit" class="btn-send">Send</button>
            </form>
        </div>
    </main>
</div>

<script>
    let activeConversationId = null;
    const conversationsList = document.getElementById('conversationsList');
    const chatMessages = document.getElementById('chatMessages');
    const activeChatTitle = document.getElementById('activeChatTitle');
    const promptForm = document.getElementById('promptForm');
    const promptInput = document.getElementById('promptInput');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnNewChat = document.getElementById('btnNewChat');

    // 1. Fetch all conversations for the sidebar
    async function loadConversations() {
        try {
            const res = await fetch('/api/conversations');
            if (res.ok) {
                const data = await res.json();
                renderConversationsList(data.conversations || []);
                
                // If no active conversation selected, pick the first one or create new
                if (data.conversations && data.conversations.length > 0) {
                    if (!activeConversationId || !data.conversations.some(c => c.id === activeConversationId)) {
                        selectConversation(data.conversations[0].id, data.conversations[0].title);
                    }
                } else {
                    createNewConversation();
                }
            }
        } catch (err) {
            console.error("Failed to load conversations:", err);
        }
    }

    // 2. Render sidebar list items with Delete action
    function renderConversationsList(conversations) {
        conversationsList.innerHTML = '';
        conversations.forEach(conv => {
            const item = document.createElement('div');
            item.className = `chat-item ${conv.id === activeConversationId ? 'active' : ''}`;
            item.onclick = () => selectConversation(conv.id, conv.title);

            const titleSpan = document.createElement('span');
            titleSpan.className = 'chat-title-text';
            titleSpan.textContent = conv.title || 'New Chat';

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-delete-chat';
            deleteBtn.title = 'Delete chat';
            deleteBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteConversation(conv.id);
            };

            item.appendChild(titleSpan);
            item.appendChild(deleteBtn);
            conversationsList.appendChild(item);
        });
    }

    // 3. Create a new conversation thread
    async function createNewConversation() {
        try {
            const res = await fetch('/api/conversations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'New Chat' })
            });
            if (res.ok) {
                const data = await res.json();
                activeConversationId = data.id;
                activeChatTitle.textContent = data.title;
                await loadConversations();
                chatMessages.innerHTML = '';
                appendMessage('How can I help you today?', 'assistant');
            }
        } catch (err) {
            console.error("Failed to create new chat:", err);
        }
    }

    // 4. Select a conversation thread
    async function selectConversation(id, title) {
        activeConversationId = id;
        activeChatTitle.textContent = title || 'Chat';
        
        // Update active class in list
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        await loadMessages(id);
        loadConversations();
    }

    // 5. Load messages for selected conversation
    async function loadMessages(convId) {
        chatMessages.innerHTML = '';
        try {
            const res = await fetch(`/api/conversations/${convId}/messages`);
            if (res.ok) {
                const data = await res.json();
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendMessage(msg.content, msg.role);
                    });
                } else {
                    appendMessage('How can I help you today?', 'assistant');
                }
            }
        } catch (err) {
            console.error("Failed to load messages:", err);
        }
    }

    // 6. Delete a conversation thread
    async function deleteConversation(convId) {
        if (!confirm('Are you sure you want to delete this chat thread?')) return;
        try {
            const res = await fetch(`/api/conversations/${convId}`, { method: 'DELETE' });
            if (res.ok) {
                if (activeConversationId === convId) {
                    activeConversationId = null;
                }
                loadConversations();
            }
        } catch (err) {
            console.error("Failed to delete chat:", err);
        }
    }

    // Append message bubble to window
    function appendMessage(text, role) {
        const group = document.createElement('div');
        group.className = `msg-group ${role}`;

        const sender = document.createElement('div');
        sender.className = 'msg-sender';
        sender.textContent = role === 'user' ? 'You' : 'Assistant';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;

        group.appendChild(sender);
        group.appendChild(bubble);
        chatMessages.appendChild(group);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Handle Prompt Form Submission
    promptForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = promptInput.value.trim();
        if (!message) return;

        if (!activeConversationId) {
            await createNewConversation();
        }

        appendMessage(message, 'user');
        promptInput.value = '';
        btnSubmit.disabled = true;

        try {
            const res = await fetch(`/api/conversations/${activeConversationId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await res.json();
            if (res.ok) {
                appendMessage(data.reply, 'assistant');
                if (data.title) {
                    activeChatTitle.textContent = data.title;
                    loadConversations();
                }
            } else {
                appendMessage(`Error: ${data.error || 'Something went wrong'}`, 'assistant');
            }
        } catch (err) {
            appendMessage('Error connecting to server.', 'assistant');
        } finally {
            btnSubmit.disabled = false;
            promptInput.focus();
        }
    });

    btnNewChat.addEventListener('click', createNewConversation);

    // Initial load
    loadConversations();
</script>
{% endblock %}
