<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Workspace - Chat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-element: #27272a;
            --bg-hover: #3f3f46;
            --border: #27272a;
            --border-subtle: #1f1f23;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Top Navigation Header for Auth pages */
        .app-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.5rem;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .brand-link {
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--text-primary);
            color: var(--bg-base);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .auth-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-sm {
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s ease;
            cursor: pointer;
            border: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--bg-element);
            color: var(--text-primary);
        }

        .btn-solid {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        .btn-solid:hover {
            background: #e4e4e7;
        }

        /* Main Wrapper */
        .main-layout {
            flex: 1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Auth Form Card Styling */
        .center-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-box {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            padding: 2rem;
        }

        .auth-header {
            margin-bottom: 1.5rem;
        }

        .auth-header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .field-group {
            margin-bottom: 1rem;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .input-field {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-block {
            width: 100%;
            padding: 0.65rem;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.15s ease;
        }

        .btn-block:hover {
            background: var(--accent-hover);
        }

        .auth-footer-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 1.25rem;
        }

        .auth-footer-text a {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        .flash-bar {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block navbar %}
    {% endblock %}

    {% block content %}
    {% endblock %}
</body>
</html>
